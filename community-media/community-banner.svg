      <stop stop-color="#1f3031"/>
      <stop offset="1" stop-color="#12191d"/>
    </linearGradient>
    <linearGradient id="case" x2="0" y2="1">
      <stop stop-color="#485559"/>
      <stop offset="1" stop-color="#252d34"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
