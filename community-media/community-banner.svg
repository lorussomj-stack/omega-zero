<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Omega-Zero Community Build</title>
  <desc id="desc">An unofficial Omega-Zero build tested on the RG35XXSP. A stylized clamshell handheld shows an achievement list.</desc>
  <defs>
